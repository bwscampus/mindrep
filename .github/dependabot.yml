# Production Standard OPS-2: weekly dependency updates, all in ONE pull request.
#
# Every ecosystem joins the same multi-ecosystem group, so Python and GitHub
# Actions updates land together. One PR also means uv.lock is regenerated once,
# against the final pyproject.toml. Separate PRs (merged one by one, or via
# "Update branch") produced a lockfile that broke Railway's `uv sync --locked`.
#
# If a grouped PR falls behind main, comment `@dependabot rebase` rather than
# clicking "Update branch", so the lockfile is rebuilt instead of text-merged.
# Security updates still arrive as their own PRs so they never wait a week.
version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "weekly"

updates:
  - package-ecosystem: "uv"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"

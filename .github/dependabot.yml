# Production Standard OPS-2: weekly dependency updates, all in ONE pull request.
#
# Every ecosystem joins the same multi-ecosystem group, so npm and GitHub
# Actions updates land together and package-lock.json is regenerated once,
# against the final package.json. Separate PRs merged one at a time produce
# lockfiles that drift from the manifest.
#
# If a grouped PR falls behind main, comment `@dependabot rebase` rather than
# clicking "Update branch", so the lockfile is rebuilt instead of text-merged.
# Security updates still arrive as their own PRs so they never wait a week.
version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: "weekly"

updates:
  - package-ecosystem: "npm"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all-dependencies"

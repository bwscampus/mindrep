name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen

      # Unit and API tests run on in-memory SQLite (see tests/conftest.py).
      - run: uv run pytest

      # Migrations against real Postgres catch what SQLite hides (JSONB,
      # constraints), and `alembic check` fails if a model changed without
      # a migration.
      - name: Migrations on Postgres
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/app
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Dependency audit
        run: |
          uv export --frozen --no-dev --no-hashes --no-emit-project -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --no-deps --disable-pip

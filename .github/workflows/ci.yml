name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      # --ci fails if package-lock.json is out of date with package.json,
      # which is also what Railway's build does.
      - run: npm ci

      # The app is vanilla JS with no build step, so there is no compiler to
      # catch a renamed export or a deleted module. This is the substitute.
      - name: Check public/ modules and imports
        run: npm run check:imports

      # Boots the server and asserts the Production Standard response rules
      # (API-4 headers, API-8 request id, API-9 health) actually hold.
      - name: Smoke test
        run: npm run smoke

      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
